<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة الـ100: العصر الجديد</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap');

        :root {
            --gold: #d4af37;
            --cyan: #00f3ff;
            --danger: #ff0044;
            --bg: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- شاشة البداية --- */
        #start-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, #1a1a1a, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .hero-title {
            font-family: 'Orbitron'; font-size: 5rem; color: var(--gold);
            text-shadow: 0 0 30px var(--gold); margin-bottom: 20px;
        }

        .setup-box {
            background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px;
            border: 1px solid var(--gold); backdrop-filter: blur(10px); text-align: center;
        }

        input {
            padding: 12px; margin: 10px; border-radius: 8px; border: 1px solid var(--gold);
            background: #000; color: #fff; width: 250px;
        }

        .btn-start {
            background: var(--gold); color: #000; padding: 15px 50px;
            font-size: 1.5rem; border: none; border-radius: 50px; cursor: pointer;
            margin-top: 20px; font-weight: bold; transition: 0.3s;
        }

        /* --- عالم اللعبة --- */
        #game-world {
            display: none; height: 100vh; width: 100vw;
            position: relative; overflow: hidden;
        }

        /* الطبقة البيئية (Backgrounds) */
        #environment {
            position: absolute; inset: 0; transition: 2s ease; z-index: 1;
        }

        .forest { background: radial-gradient(circle, #1a472a, #050f08); }
        .snow { background: radial-gradient(circle, #90caf9, #0d47a1); }
        .volcano { background: radial-gradient(circle, #8a0000, #1a0000); }
        .desert { background: radial-gradient(circle, #d4a373, #3e2723); }
        .castle { background: radial-gradient(circle, #4a148c, #000); }

        /* الكاميرا والمسار */
        #viewport {
            position: absolute; inset: 0; z-index: 2;
            perspective: 1200px;
        }

        #camera {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #path-container {
            position: absolute; width: 10000px; height: 2000px;
            top: 50%; transform: translateY(-50%) rotateX(60deg);
            transform-style: preserve-3d;
        }

        .waypoint {
            position: absolute; width: 30px; height: 30px;
            background: var(--cyan); border-radius: 50%;
            box-shadow: 0 0 20px var(--cyan); transform: translateZ(1px);
        }

        /* الشخصيات */
        .character {
            position: absolute; width: 60px; height: 100px;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d; z-index: 100;
        }

        .char-visual {
            width: 100%; height: 100%; position: relative;
            background: var(--gold); clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            animation: float 2s infinite alternate;
        }

        @keyframes float { from { transform: translateY(0); } to { transform: translateY(-20px); } }

        /* الواجهة العلوية (HUD) */
        .hud {
            position: fixed; top: 0; width: 100%; display: flex;
            justify-content: space-between; padding: 20px 40px; z-index: 1000;
        }

        .team-card {
            background: rgba(0,0,0,0.7); padding: 15px 30px;
            border-radius: 15px; border-bottom: 4px solid var(--gold);
            backdrop-filter: blur(10px);
        }

        .dice-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 100px; height: 100px; background: var(--gold);
            border-radius: 50%; border: 4px solid #fff; color: #000;
            font-size: 2.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; box-shadow: 0 0 30px var(--gold);
        }

        /* نافذة التحدي */
        #challenge-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 10000; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }

        .timer-display { font-family: 'Orbitron'; font-size: 8rem; color: #fff; margin: 20px 0; }
        .challenge-type { font-size: 3rem; color: var(--gold); text-transform: uppercase; }

        .btn-group { display: flex; gap: 20px; margin-top: 30px; }
        .action-btn {
            padding: 15px 40px; font-size: 1.2rem; border-radius: 10px;
            border: none; cursor: pointer; font-weight: bold;
        }
        .btn-success { background: #00ff88; color: #000; }
        .btn-fail { background: var(--danger); color: #fff; }
        .btn-timer { background: var(--cyan); color: #000; }

    </style>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="start-screen">
        <h1 class="hero-title">رحلة الـ100</h1>
        <div class="setup-box">
            <div style="display: flex; gap: 30px;">
                <div>
                    <h3 style="color: var(--gold)">الفريق الأول</h3>
                    <input type="text" id="t1-name" placeholder="اسم الفريق">
                    <input type="text" id="t1-players" placeholder="اللاعبين (فاصلة)">
                </div>
                <div>
                    <h3 style="color: var(--cyan)">الفريق الثاني</h3>
                    <input type="text" id="t2-name" placeholder="اسم الفريق">
                    <input type="text" id="t2-players" placeholder="اللاعبين (فاصلة)">
                </div>
            </div>
            <button class="btn-start" onclick="initGame()">ابدأ الرحلة</button>
        </div>
    </div>

    <!-- اللعبة -->
    <div id="game-world">
        <div id="environment" class="forest"></div>
        
        <div class="hud">
            <div class="team-card" id="card-0">
                <h2 id="name-0">الفريق الذهبي</h2>
                <p>النقاط: <span id="score-0">0</span> | الخانة: <span id="pos-0">1</span></p>
            </div>
            <div style="text-align: center;">
                <h1 id="current-player" style="font-family: 'Orbitron'; color: var(--gold);">WELCOME</h1>
                <p id="zone-name">الغابة الغامضة</p>
            </div>
            <div class="team-card" id="card-1" style="border-color: var(--cyan);">
                <h2 id="name-1" style="color: var(--cyan)">الفريق السيبراني</h2>
                <p>النقاط: <span id="score-1">0</span> | الخانة: <span id="pos-1">1</span></p>
            </div>
        </div>

        <div id="viewport">
            <div id="camera">
                <div id="path-container"></div>
                <div id="player-0" class="character"><div class="char-visual"></div></div>
                <div id="player-1" class="character"><div class="char-visual" style="background: var(--cyan)"></div></div>
            </div>
        </div>

        <div class="dice-btn" id="dice" onclick="rollDice()">🎲</div>
    </div>

    <!-- المودال -->
    <div id="challenge-modal">
        <h1 id="modal-type" class="challenge-type">تحدي السرعة</h1>
        <div id="timer" class="timer-display">05</div>
        <div class="btn-group">
            <button class="action-btn btn-timer" onclick="toggleTimer()">ابدأ / إيقاف المؤقت</button>
            <button class="action-btn btn-success" onclick="endChallenge(true)">نجاح (+2 خطوات)</button>
            <button class="action-btn btn-fail" onclick="endChallenge(false)">فشل (-2 خطوات)</button>
        </div>
        <p style="margin-top: 20px; font-size: 1.2rem; opacity: 0.7;">النجاح يقدمك خطوتين، الفشل يعيدك خطوتين.</p>
    </div>

    <script>
        /* --- منطق اللعبة --- */
        let state = {
            teams: [
                { name: "", players: [], pos: 1, score: 0 },
                { name: "", players: [], pos: 1, score: 0 }
            ],
            turn: 0,
            playerIdx: [0, 0],
            isMoving: false,
            points: [],
            timerInterval: null,
            currentSeconds: 0
        };

        // إنشاء نقاط المسار (100 نقطة متعرجة)
        function createPath() {
            const container = document.getElementById('path-container');
            for (let i = 0; i < 100; i++) {
                const x = i * 150;
                const y = Math.sin(i * 0.4) * 400;
                state.points.push({x, y});

                const wp = document.createElement('div');
                wp.className = 'waypoint';
                wp.style.left = x + 'px';
                wp.style.top = (y + 1000) + 'px';
                
                // تلوين الخانات الخاصة
                if (i % 7 === 0) wp.style.background = '#ff0044';
                if (i % 5 === 0) wp.style.background = '#ffd700';

                container.appendChild(wp);
            }
        }

        function initGame() {
            state.teams[0].name = document.getElementById('t1-name').value || "الذهبي";
            state.teams[0].players = document.getElementById('t1-players').value.split(',');
            state.teams[1].name = document.getElementById('t2-name').value || "السيبراني";
            state.teams[1].players = document.getElementById('t2-players').value.split(',');

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-world').style.display = 'block';
            
            createPath();
            updatePositions();
            updateHUD();
        }

        function rollDice() {
            if (state.isMoving) return;
            const roll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice').innerText = roll;
            animateMove(roll);
        }

        async function animateMove(steps) {
            state.isMoving = true;
            let team = state.teams[state.turn];
            let targetPos = Math.min(team.pos + steps, 100);

            for (let i = team.pos; i <= targetPos; i++) {
                team.pos = i;
                updatePositions();
                updateCamera(i);
                updateEnvironment(i);
                await new Promise(r => setTimeout(r, 400));
            }

            checkLanding(targetPos);
        }

        function updatePositions() {
            for (let i = 0; i < 2; i++) {
                const pt = state.points[state.teams[i].pos - 1];
                const char = document.getElementById(`player-${i}`);
                char.style.left = pt.x + 'px';
                char.style.top = (pt.y + 950) + (i * 20) + 'px';
            }
        }

        function updateCamera(pos) {
            const pt = state.points[pos - 1];
            document.getElementById('camera').style.transform = `translateX(${-pt.x + 400}px)`;
        }

        function updateEnvironment(i) {
            const env = document.getElementById('environment');
            const zoneText = document.getElementById('zone-name');
            if (i < 20) { env.className = 'forest'; zoneText.innerText = "الغابة العميقة"; }
            else if (i < 40) { env.className = 'desert'; zoneText.innerText = "صحراء النسيان"; }
            else if (i < 60) { env.className = 'snow'; zoneText.innerText = "القمم الثلجية"; }
            else if (i < 85) { env.className = 'volcano'; zoneText.innerText = "وادي البراكين"; }
            else { env.className = 'castle'; zoneText.innerText = "قلعة النهاية"; }
        }

        function checkLanding(pos) {
            let type = "";
            let time = 0;

            if (pos % 7 === 0) { type = "تحدي السرعة"; time = 5; }
            else if (pos % 5 === 0) { type = "تحدي الثقافة العامة"; time = 15; }
            else if (pos % 9 === 0) { type = "تحدي المشاهير"; time = 20; }

            if (type) {
                openModal(type, time);
            } else {
                state.isMoving = false;
                switchTurn();
            }
        }

        function openModal(type, time) {
            state.currentSeconds = time;
            document.getElementById('modal-type').innerText = type;
            document.getElementById('timer').innerText = time;
            document.getElementById('challenge-modal').style.display = 'flex';
        }

        function toggleTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            } else {
                state.timerInterval = setInterval(() => {
                    state.currentSeconds--;
                    document.getElementById('timer').innerText = state.currentSeconds;
                    if (state.currentSeconds <= 0) clearInterval(state.timerInterval);
                }, 1000);
            }
        }

        async function endChallenge(success) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
            document.getElementById('challenge-modal').style.display = 'none';

            let team = state.teams[state.turn];
            let move = success ? 2 : -2;
            team.pos = Math.max(1, Math.min(100, team.pos + move));
            
            if (success) team.score += 10;
            
            updatePositions();
            updateHUD();
            state.isMoving = false;
            switchTurn();
        }

        function switchTurn() {
            state.playerIdx[state.turn] = (state.playerIdx[state.turn] + 1) % state.teams[state.turn].players.length;
            state.turn = state.turn === 0 ? 1 : 0;
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('pos-0').innerText = state.teams[0].pos;
            document.getElementById('score-0').innerText = state.teams[0].score;
            document.getElementById('pos-1').innerText = state.teams[1].pos;
            document.getElementById('score-1').innerText = state.teams[1].score;
            document.getElementById('name-0').innerText = state.teams[0].name;
            document.getElementById('name-1').innerText = state.teams[1].name;

            const currentTeam = state.teams[state.turn];
            const currentPlayer = currentTeam.players[state.playerIdx[state.turn]];
            document.getElementById('current-player').innerText = currentPlayer || "PLAYER";
            document.getElementById('current-player').style.color = state.turn === 0 ? 'var(--gold)' : 'var(--cyan)';
        }
    </script>
</body>
</html>
