<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>عيدية حمود وياش | اختار ظرفك</title>
    <!-- Tajawal font + Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(145deg, #fef1e0 0%, #fde3cc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        /* خلفية بسيطة واحتفالية خفيفة */
        body::before {
            content: "🐏🌙⭐";
            position: absolute;
            font-size: 100px;
            opacity: 0.04;
            bottom: 15px;
            left: 15px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 30% 40%, rgba(230, 150, 50, 0.05) 2%, transparent 2.5%);
            background-size: 35px 35px;
            pointer-events: none;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: auto;
            z-index: 2;
            position: relative;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* البطاقة الأساسية - تصميم نظيف وفخم */
        .eid-wrapper {
            background: rgba(255, 252, 245, 0.98);
            border-radius: 55px 55px 65px 55px;
            box-shadow: 0 30px 45px -20px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 245, 200, 0.9);
            padding: 2rem 1.5rem 2rem;
            text-align: center;
            border: 1px solid #f9e2bd;
        }

        /* الهلال والعنوان */
        .header-icon {
            font-size: 2.4rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #b25612, #e09d48);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 8px 0 5px;
        }

        .greeting {
            background: #fef0e1;
            display: inline-block;
            padding: 4px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #aa591b;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        /* عنوان الاختيار */
        .choice-title {
            font-weight: 800;
            font-size: 1.25rem;
            background: #fff1e3;
            width: fit-content;
            margin: 0 auto 20px auto;
            padding: 6px 18px;
            border-radius: 50px;
            color: #a45318;
            box-shadow: inset 0 1px 2px #ffeee0, 0 2px 5px rgba(0,0,0,0.02);
        }

        /* شبكة الظروف - منظمة ومرتبة */
        .envelopes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 35px;
        }

        /* تصميم كل ظرف صغير ولكن واضح */
        .envelope-card {
            flex: 1;
            min-width: 130px;
            background: linear-gradient(135deg, #fff9f2, #fff3e6);
            border-radius: 45px 30px 50px 30px;
            padding: 1.2rem 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 15px 25px -12px rgba(92, 52, 12, 0.2);
            border: 1px solid #f5debc;
            text-align: center;
        }

        .envelope-card:hover {
            transform: translateY(-5px);
            background: #fffaf3;
            border-color: #ffd9a5;
            box-shadow: 0 22px 30px -14px #985e2866;
        }

        .envelope-card:active {
            transform: scale(0.97);
            transition: 0.03s;
        }

        /* أيقونة الظرف */
        .env-icon {
            font-size: 2.8rem;
            background: white;
            width: 75px;
            height: 75px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 35px;
            box-shadow: 0 8px 14px rgba(0,0,0,0.05), inset 0 1px 2px white;
            color: #c57126;
        }

        .env-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #9c571f;
            letter-spacing: -0.3px;
        }

        .click-hint {
            font-size: 0.75rem;
            background: #faeedf;
            margin-top: 8px;
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 600;
            color: #b46623;
        }

        /* المنطقة الثابتة التي تظهر فيها العيدية بعد اختيار الظرف */
        .result-area {
            margin-top: 20px;
            padding: 12px 12px;
            background: #fff6ec;
            border-radius: 50px;
            transition: all 0.2s;
            border: 1px dashed #f5cf9e;
        }

        .result-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #b2631d;
            letter-spacing: 0.5px;
        }

        .eidy-message {
            font-size: 1.8rem;
            font-weight: 900;
            color: #c26f26;
            background: #fff0e0;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 60px;
            margin-top: 8px;
            box-shadow: inset 0 1px 3px #fff3e4, 0 4px 8px rgba(0,0,0,0.02);
        }

        .eidy-message i {
            margin: 0 6px;
            font-size: 1.5rem;
            color: #e49444;
        }

        /* توقيع حمود وياش الصغير (اختياري للزينة) */
        .signature {
            margin-top: 28px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #f8e8da;
            padding: 6px 15px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #b15f21;
        }

        /* استجابة الجوال */
        @media (max-width: 500px) {
            .container {
                padding: 0;
            }
            .eid-wrapper {
                padding: 1.5rem 1rem 1.8rem;
                border-radius: 45px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .envelopes-grid {
                gap: 12px;
            }
            .envelope-card {
                min-width: 100px;
                padding: 1rem 0.3rem;
            }
            .env-icon {
                width: 60px;
                height: 60px;
                font-size: 2.3rem;
            }
            .env-name {
                font-size: 1.2rem;
            }
            .eidy-message {
                font-size: 1.4rem;
                padding: 8px 16px;
            }
            .eidy-message i {
                font-size: 1.2rem;
            }
        }

        /* تأثير بسيط عند ظهور العيدية */
        @keyframes gentlePop {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-effect {
            animation: gentlePop 0.3s cubic-bezier(0.2, 1.2, 0.4, 1);
        }

        /* زر الظروف لا يحتوي على أي مودال معقد */
        footer {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="eid-wrapper">
        <!-- رأس العيد -->
        <div class="header-icon">
            <span>🌙</span> <span>🐏</span> <span>✨</span>
        </div>
        <h1>كل عام وأنتم بخير</h1>
        <div class="greeting">عيد أضحى مبارك ✨</div>

        <!-- اختار ظرفك من عند حمود (منظم وصريح) -->
        <div class="choice-title">
            <i class="fas fa-envelope"></i> اختار ظرف من عند حمود <i class="fas fa-gift"></i>
        </div>

        <div class="envelopes-grid" id="envelopesContainer">
            <!-- ظرف 1 -->
            <div class="envelope-card" data-env="1">
                <div class="env-icon"><i class="fas fa-envelope-open-text"></i></div>
                <div class="env-name">ظرف ١</div>
                <div class="click-hint"><i class="fas fa-hand-pointer"></i> اضغط</div>
            </div>
            <!-- ظرف 2 -->
            <div class="envelope-card" data-env="2">
                <div class="env-icon"><i class="fas fa-envelope"></i></div>
                <div class="env-name">ظرف ٢</div>
                <div class="click-hint"><i class="fas fa-hand-pointer"></i> اضغط</div>
            </div>
            <!-- ظرف 3 -->
            <div class="envelope-card" data-env="3">
                <div class="env-icon"><i class="fas fa-envelope-circle-check"></i></div>
                <div class="env-name">ظرف ٣</div>
                <div class="click-hint"><i class="fas fa-hand-pointer"></i> اضغط</div>
            </div>
        </div>

        <!-- منطقة عرض العيدية (تظهر النص عند الضغط على أي ظرف) -->
        <div class="result-area" id="resultArea">
            <div class="result-label"><i class="fas fa-gift"></i> عيديتك من حمود وياش</div>
            <div id="eidyDisplay" class="eidy-message">
                📩 اضغط على ظرف 📩
            </div>
        </div>

        <!-- توقيع صغير أنيق (حمود وياش) -->
        <div class="signature">
            <i class="fas fa-star-of-life"></i> حمود وياش يهنئونك بالعيد <i class="fas fa-heart"></i>
        </div>
    </div>
</div>

<script>
    (function() {
        // الحصول على العناصر
        const envelopes = document.querySelectorAll('.envelope-card');
        const eidyDisplayDiv = document.getElementById('eidyDisplay');
        
        // النص الثابت الذي سيظهر عند أي ظرف
        const EIDY_TEXT = "🎁 عيديتك حمود وياش 🎁";
        
        // وظيفة لتحديث النص مع تأثير بسيط
        function showEidyMessage() {
            if (!eidyDisplayDiv) return;
            // تغيير المحتوى
            eidyDisplayDiv.innerHTML = `<i class="fas fa-gift"></i> ${EIDY_TEXT} <i class="fas fa-candy-cane"></i>`;
            // إضافة تأثير حركي بسيط (تأكيد بصري لطيف)
            eidyDisplayDiv.classList.add('pop-effect');
            setTimeout(() => {
                if (eidyDisplayDiv) eidyDisplayDiv.classList.remove('pop-effect');
            }, 300);
            
            // إضافة اهتزاز خفيف اختياري إذا كان الجهاز يدعم (تحسين تجربة الجوال)
            if (navigator.vibrate) {
                navigator.vibrate(20);
            }
        }
        
        // إضافة مستمع لكل ظرف
        envelopes.forEach(envelope => {
            // حدث النقر (للماوس واللمس)
            envelope.addEventListener('click', (e) => {
                e.stopPropagation();
                // إضافة تأثير تفاعلي فوري للظرف (كأنه ينضغط)
                envelope.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    envelope.style.transform = '';
                }, 120);
                
                // عرض العيدية (نفس النص لأي ظرف)
                showEidyMessage();
            });
            
            // للأجهزة التي تعتمد على touchstart بشكل إضافي لضمان السرعة
            envelope.addEventListener('touchstart', (e) => {
                // لا نريد منع الافتراضي بالكامل ولكن نضمن استجابة اللمس
                e.preventDefault();
                envelope.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    envelope.style.transform = '';
                }, 100);
                showEidyMessage();
            });
        });
        
        // جعل النص الافتراضي في البداية (اختياري ولكن نتركه كما هو)
        // إذا كان المستخدم لم يضغط بعد يبقى النص "اضغط على ظرف"
        // لا حاجة لشيء آخر، بسيط ومنظم جداً.
        
        // إضافة لمسة صغيرة: إذا تم الضغط على أي ظرف، نتأكد من أن النص قد تم تحديثه
        // أيضًا نقوم بحفظ حالة بسيطة لكن المطلوب تحقق تماماً
        console.log("موقع صغير ومنظم: اختر أي ظرف، يظهر لك النص (عيديتك حمود وياش)");
        
        // تحسين للجوال: عدم وجود أي مودال معقد، فقط تغيير النص في نفس الصفحة
        // التصميم مناسب جداً للعيد.
    })();
</script>
</body>
</html>
